# https://www.electron.build/configuration
appId: codes.mhd.runbook
productName: Runbook

# The newer AppImage toolset (as in snip), still marked beta. Its runtime is static, so
# the AppImage needs no libfuse2, which Ubuntu 24.04 doesn't install; and its launcher
# turns Chromium's sandbox off where the system blocks it.
toolsets:
  appimage: "1.0.3"
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  # node-pty's C++ sources and its macOS/Windows builds and libraries: Linux loads the
  # pty.node electron-builder builds into node_modules/node-pty/build.
  - "!**/node_modules/node-pty/{prebuilds,deps,src,scripts}/**"
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true

linux:
  target:
    - AppImage
    - deb
  category: Development
  # The .deb's one-line summary. package.json's description is its long one, and also
  # the tooltip in app launchers, so it stays short.
  synopsis: Markdown notes with shell cells you can run
  syncDesktopName: true
  maintainer: MHD
  # No version in the names (runbook-x86_64.AppImage, runbook-amd64.deb): an AppImage
  # update keeps its file's name, so a version in it would be wrong after the first
  # update, and the website links to releases/latest/download/<name>.
  artifactName: ${name}-${arch}.${ext}
deb:
  packageCategory: devel
  # Replaces electron-builder's default list with what runbook needs. The first four cover
  # every library the Electron binary links against (GTK pulls in the X11, ATK and cups libs).
  # libasound2 alone is a virtual package on Ubuntu 24.04, where apt may pick an incompatible
  # stand-in, so the real package comes first. Add libnotify4 if the app shows notifications.
  depends:
    - libgtk-3-0
    - libnss3
    - libasound2t64 | libasound2
    - libgbm1
    - libsecret-1-0 # keyring for the enableCookieEncryption fuse
    - xdg-utils # xdg-open, used by shell.openExternal

# Only so the build writes latest-linux.yml (and app-update.yml inside the AppImage),
# which the AppImage's update check reads. Builds run with --publish never: the release
# workflow uploads the files.
publish:
  provider: github
  owner: mhdcodes
  repo: runbook
