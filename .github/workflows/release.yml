# Builds the Linux installers (AppImage and deb) with electron-builder. Pushing a tag like
# v1.2.0 also publishes them as a GitHub release; running it by hand only builds them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # installs Node.js, the pnpm from packageManager in package.json, and the
      # dependencies exactly as pnpm-lock.yaml has them
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # before the build, so the version is baked into the app and latest-linux.yml
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - run: pnpm build
      - run: pnpm exec electron-builder --linux --publish never

      # one unzipped artifact per download, named after the file, so a run's page lists
      # them like a release does
      - uses: actions/upload-artifact@v7
        with:
          path: dist/runbook-x86_64.AppImage
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/runbook-amd64.deb
          archive: false
      # what the AppImage's update check reads: the latest version, its AppImage's
      # name and sha512
      - uses: actions/upload-artifact@v7
        with:
          path: dist/latest-linux.yml
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
